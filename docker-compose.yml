services:
  # 1. Base de données MongoDB
  mongodb:
    image: mongo:latest
    container_name: ynov-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./database/seed_movies.js:/docker-entrypoint-initdb.d/seed_movies.js:ro
    networks:
      - ynov-network

  # 2. API Backend (Node.js / Express / Mongoose)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ynov-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/cours_db?directConnection=true
    depends_on:
      - mongodb
    networks:
      - ynov-network

  # 3. Tests de charge k6 avec Web Dashboard (sur profil 'test')
  k6:
    image: grafana/k6:latest
    container_name: ynov-k6
    volumes:
      - ./tests-k6:/scripts
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0
      - K6_WEB_DASHBOARD_PORT=5665
      - TARGET_URL=http://backend:3000
      - MAX_VUS=${MAX_VUS:-500}
      - MAX_PING_MS=${MAX_PING_MS:-500}
    entrypoint: ["k6", "run", "--linger", "/scripts/load-test.js"]
    networks:
      - ynov-network
    profiles:
      - test

  # 4. Tests de charge k6 en mode CI (sortie automatique avec code retour)
  k6-ci:
    image: grafana/k6:latest
    container_name: ynov-k6-ci
    volumes:
      - ./tests-k6:/scripts
    environment:
      - TARGET_URL=http://backend:3000
      - MAX_VUS=${MAX_VUS:-500}
      - MAX_PING_MS=${MAX_PING_MS:-500}
    entrypoint: ["k6", "run", "/scripts/load-test.js"]
    networks:
      - ynov-network
    profiles:
      - test

volumes:
  mongo-data:

networks:
  ynov-network:
    driver: bridge
