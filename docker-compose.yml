name: cineslot

services:
  mongodb:
    image: mongo:8.0
    container_name: ynov-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME requis}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD requis}
      - MONGO_MASTER_PASSWORD=${MONGO_MASTER_PASSWORD:?MONGO_MASTER_PASSWORD requis}
      - MONGO_TENANT_PASSWORD=${MONGO_TENANT_PASSWORD:?MONGO_TENANT_PASSWORD requis}
      - MONGO_PURGE_PASSWORD=${MONGO_PURGE_PASSWORD:?MONGO_PURGE_PASSWORD requis}
    volumes:
      - mongo-data:/data/db
      - ./database/00-init-roles.js:/docker-entrypoint-initdb.d/00-init-roles.js:ro
      - ./database/seed_cinematheque.js:/docker-entrypoint-initdb.d/seed_cinematheque.js:ro
    networks:
      - data-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ynov-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://cineslotMaster:${MONGO_MASTER_PASSWORD:?MONGO_MASTER_PASSWORD requis}@mongodb:27017/cours_db?authSource=admin&directConnection=true
      - MONGO_MASTER_URI=mongodb://cineslotMaster:${MONGO_MASTER_PASSWORD:?MONGO_MASTER_PASSWORD requis}@mongodb:27017/?authSource=admin&directConnection=true
      - MONGO_TENANT_URI=mongodb://cineslotTenant:${MONGO_TENANT_PASSWORD:?MONGO_TENANT_PASSWORD requis}@mongodb:27017/?authSource=admin&directConnection=true
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET requis}
      - AUDIT_KEY=${AUDIT_KEY:?AUDIT_KEY requis}
      - ENABLE_DEMO_ROUTES=${ENABLE_DEMO_ROUTES:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:5173,http://127.0.0.1:3001,http://127.0.0.1:5173}
      - SMS_GATEWAY_URL=http://sms-passerelle:8090/sms
      - SMTP_URL=${SMTP_URL:-smtp://mailpit:1025}
      - APP_URL=${APP_URL:-http://cineslot.localhost:3001}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OTEL_SERVICE_NAME=cineslot-api
      - OTEL_RESOURCE_ATTRIBUTES=service.version=${GIT_SHA:-local}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_TRACES_SAMPLER=parentbased_always_on
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      mongodb:
        condition: service_healthy
      collector:
        condition: service_started
      sms-passerelle:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - ynov-network
      - data-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ynov-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:80"
    environment:
      - NODE_ENV=production
    networks:
      - ynov-network
    depends_on:
      - backend
      - collector

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ynov-frontend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    networks:
      - ynov-network
    depends_on:
      - backend
    profiles:
      - dev

  k6:
    image: grafana/k6:0.54.0
    container_name: ynov-k6
    volumes:
      - ./tests-k6:/scripts
    ports:
      - "127.0.0.1:5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0
      - K6_WEB_DASHBOARD_PORT=5665
      - TARGET_URL=http://backend:3000
      - MAX_VUS=${MAX_VUS:-500}
      - MAX_PING_MS=${MAX_PING_MS:-500}
      - K6_ROOT_DOMAIN=${K6_ROOT_DOMAIN:-cineslot.localhost:3001}
      - K6_TENANTS=${K6_TENANTS:-cine-bellecour,cine-part-dieu}
      - K6_ADMIN_EMAIL=${K6_ADMIN_EMAIL:-}
      - K6_ADMIN_PASSWORD=${K6_ADMIN_PASSWORD:-}
    entrypoint: ["k6", "run", "--linger", "/scripts/load-test.js"]
    networks:
      - ynov-network
    profiles:
      - test

  k6-ci:
    image: grafana/k6:0.54.0
    container_name: ynov-k6-ci
    volumes:
      - ./tests-k6:/scripts
    environment:
      - TARGET_URL=http://backend:3000
      - MAX_VUS=${MAX_VUS:-500}
      - MAX_PING_MS=${MAX_PING_MS:-500}
      - K6_ROOT_DOMAIN=${K6_ROOT_DOMAIN:-cineslot.localhost:3001}
      - K6_TENANTS=${K6_TENANTS:-cine-bellecour,cine-part-dieu}
      - K6_ADMIN_EMAIL=${K6_ADMIN_EMAIL:-}
      - K6_ADMIN_PASSWORD=${K6_ADMIN_PASSWORD:-}
    entrypoint: ["k6", "run", "/scripts/load-test.js"]
    networks:
      - ynov-network
    profiles:
      - test

  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    container_name: ynov-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observabilite/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - ynov-network
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: ynov-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - ynov-network

  sms-passerelle:
    build:
      context: ./sms-passerelle
      dockerfile: Dockerfile
    container_name: ynov-sms-passerelle
    restart: unless-stopped
    environment:
      - PORT=8090
      - SMS_DELAY_MS=1100
    networks:
      - ynov-network

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: ynov-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - ynov-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: cineslot-sonarqube
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - ynov-network
    profiles:
      - quality

volumes:
  mongo-data:
  sonarqube_data:
    external: true
    name: cineslot-sonarqube_sonarqube_data
  sonarqube_extensions:
    external: true
    name: cineslot-sonarqube_sonarqube_extensions
  sonarqube_logs:
    external: true
    name: cineslot-sonarqube_sonarqube_logs

networks:
  ynov-network:
    driver: bridge
    # fixed subnet inside 172.16.0.0/12 so the host gateway matches frontend/nginx/admin-allowlist.conf (OrbStack defaults to 192.168.x.x)
    ipam:
      config:
        - subnet: 172.28.0.0/24
  data-network:
    driver: bridge
    internal: true
