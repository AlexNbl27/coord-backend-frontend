version: '3.8'

services:
  # ===========================================================================
  # 1. Base de données MongoDB
  # ===========================================================================
  mongodb:
    image: mongo:latest
    container_name: ynov-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./database/seed_cinematheque.js:/docker-entrypoint-initdb.d/seed_cinematheque.js:ro
    networks:
      - ynov-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ===========================================================================
  # 2. API Backend Unifiée (Node.js / Express / Mongoose)
  # Films, Séances SSE, Billetterie et Test A/B
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ynov-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/cours_db?directConnection=true
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ynov-network

  # ===========================================================================
  # 3. Frontend Production (Nginx + Vue 3)
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ynov-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    environment:
      - NODE_ENV=production
    networks:
      - ynov-network
    depends_on:
      - backend

  # ===========================================================================
  # 3b. Frontend Development (Vite + Vue 3 + TypeScript)
  # ===========================================================================
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ynov-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev
    networks:
      - ynov-network
    depends_on:
      - backend
    profiles:
      - dev

  # ===========================================================================
  # 4. Tests de charge k6 avec Web Dashboard (profil 'test')
  # ===========================================================================
  k6:
    image: grafana/k6:latest
    container_name: ynov-k6
    volumes:
      - ./tests-k6:/scripts
    ports:
      - "5665:5665"
    environment:
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_HOST=0.0.0.0
      - K6_WEB_DASHBOARD_PORT=5665
      - TARGET_URL=http://backend:3000
      - MAX_VUS=${MAX_VUS:-500}
      - MAX_PING_MS=${MAX_PING_MS:-500}
    entrypoint: ["k6", "run", "--linger", "/scripts/load-test.js"]
    networks:
      - ynov-network
    profiles:
      - test

  # ===========================================================================
  # 6. Tests de charge k6 en mode CI (sortie automatique)
  # ===========================================================================
  k6-ci:
    image: grafana/k6:latest
    container_name: ynov-k6-ci
    volumes:
      - ./tests-k6:/scripts
    environment:
      - TARGET_URL=http://backend:3000
      - MAX_VUS=${MAX_VUS:-500}
      - MAX_PING_MS=${MAX_PING_MS:-500}
    entrypoint: ["k6", "run", "/scripts/load-test.js"]
    networks:
      - ynov-network
    profiles:
      - test

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  mongo-data:

# ===========================================================================
# Réseaux
# ===========================================================================
networks:
  ynov-network:
    driver: bridge
