name: API Load Testing (k6)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simuler un échec de performance (seuil 1ms) pour tester la création d issue ?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  load-test:
    name: Run k6 Load & Stress Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Start MongoDB & Backend stack
        run: |
          docker compose up -d mongodb backend

      - name: ⏳ Wait for API to be healthy
        run: |
          echo "Waiting for Backend API (http://localhost:3000/health) to be ready..."
          max_retries=30
          count=0
          until curl -s http://localhost:3000/health | grep -q '"database":"connected"'; do
            sleep 2
            count=$((count+1))
            if [ $count -ge $max_retries ]; then
              echo "❌ Backend did not become healthy in time!"
              docker compose logs backend
              exit 1
            fi
          done
          echo "✅ API is up and connected to MongoDB!"

      - name: 📊 Execute k6 Load Test
        id: k6_test
        run: |
          if [ "${{ github.event.inputs.simulate_failure }}" = "true" ]; then
            echo "⚠️ Simulation d'échec activée : seuil imposé à 1ms pour déclencher l'alerte !"
            docker compose run --rm --entrypoint "k6 run /scripts/load-test.js --threshold 'http_req_duration=p(95)<1'" k6
          else
            docker compose run --rm k6-ci
          fi

      - name: 🚨 Create GitHub Issue on Test Failure
        if: failure() && steps.k6_test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');

            const title = `🚨 [Performance Regression] Échec du test k6 sur ${branch} (${commitSha})`;
            const body = `## ⚠️ Régression de performance détectée lors du test de charge !

Un ou plusieurs seuils de performance (*thresholds*) ou taux d'erreurs ont été dépassés lors de l'exécution du test automatisé k6.

### 📋 Informations du Run
| Paramètre | Valeur |
| :--- | :--- |
| **Branche** | \`${branch}\` |
| **Commit** | [\`${commitSha}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) |
| **Auteur / Déclencheur** | @${context.actor} |
| **Logs GitHub Actions** | [Accéder aux logs de la CI](${runUrl}) |
| **Date & Heure** | ${new Date().toUTCString()} |

---

### 🔍 Actions correctives suggérées pour l'équipe :
- [ ] Vérifier les temps de réponse du Backend sur les routes lourdes (\`/api/movies\` avec filtres).
- [ ] Vérifier les index MongoDB dans \`backend/src/models/Movie.js\` ou \`database/seed_movies.js\`.
- [ ] Inspecter la consommation CPU/RAM de l'API Node.js et de MongoDB sous forte concurrence.
- [ ] Relancer un test local avec le Web Dashboard : \`docker compose run --rm -p 5665:5665 k6\`

> *Issue générée automatiquement par le pipeline CI GitHub Actions.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'performance', 'ci-failure', 'automated-issue']
            });

      - name: 🧹 Teardown Docker Stack
        if: always()
        run: |
          docker compose down -v
