name: API Load Testing (k6)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:
    inputs:
      max_vus:
        description: 'Capacité maximale ciblée (MAX_VUS) - Les paliers seront à 10%, 30%, 60%, 100%'
        required: false
        default: '500'
      max_ping_ms:
        description: 'Marge de ping tolérée en ms (p95) avant création de ticket (défaut: 500)'
        required: false
        default: '500'

permissions:
  contents: read
  issues: write

jobs:
  load-test:
    name: Run k6 Load & Stress Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Start MongoDB & Backend stack
        run: |
          docker compose up -d mongodb backend

      - name: ⏳ Wait for API to be healthy
        run: |
          echo "Waiting for Backend API (http://localhost:3000/health) to be ready..."
          max_retries=30
          count=0
          until curl -s http://localhost:3000/health | grep -q '"database":"connected"'; do
            sleep 2
            count=$((count+1))
            if [ $count -ge $max_retries ]; then
              echo "❌ Backend did not become healthy in time!"
              docker compose logs backend
              exit 1
            fi
          done
          echo "✅ API is up and connected to MongoDB!"

      - name: 📊 Execute k6 Load Test
        id: k6_test
        run: |
          MAX_VUS="${{ github.event.inputs.max_vus || '500' }}"
          MAX_PING="${{ github.event.inputs.max_ping_ms || '500' }}"
          echo "Lancement du test k6 (MAX_VUS: ${MAX_VUS}, Paliers: 10%, 30%, 60%, 100%, Tolérance ping: ${MAX_PING}ms)..."
          docker compose run --rm -e MAX_VUS="$MAX_VUS" -e MAX_PING_MS="$MAX_PING" k6-ci

      - name: 🚨 Create GitHub Issue on Test Failure
        if: failure() && steps.k6_test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const maxVus = '${{ github.event.inputs.max_vus || '500' }}';
            const maxPing = '${{ github.event.inputs.max_ping_ms || '500' }}';

            const title = `🚨 [Rupture de Charge] L API ne répond plus aux exigences de ping (<${maxPing}ms) sur ${branch} (${commitSha})`;
            const body = [
              '## ⚠️ Rupture de charge détectée lors des tests par paliers !',
              '',
              `Le serveur a dépassé la marge de ping tolérée (seuil **p(95) < ${maxPing}ms**) ou le taux d erreurs a excédé 1%.`,
              '',
              '### 📋 Informations du Run',
              '| Paramètre | Valeur |',
              '| :--- | :--- |',
              `| **Branche** | \`${branch}\` |`,
              `| **Commit** | [\`${commitSha}\`](${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) |`,
              `| **Capacité cible (100%)** | \`${maxVus} VUs simultanés\` |`,
              `| **Paliers exécutés** | \`10%, 30%, 60%, 100%\` |`,
              `| **Marge de ping tolérée** | \`${maxPing} ms\` (p95) |`,
              `| **Déclenché par** | @${context.actor} |`,
              `| **Logs de la CI** | [Consulter le rapport k6 détaillé](${runUrl}) |`,
              `| **Date** | ${new Date().toISOString()} |`,
              '',
              '---',
              '',
              '### 🔍 Diagnostic recommandé :',
              '- [ ] Identifier à quel palier (10%, 30%, 60% ou 100%) le ping a franchi la marge tolérée.',
              '- [ ] Vérifier la saturation de l Event Loop Node.js ou du pool de connexions MongoDB.',
              '- [ ] Mettre en place un clustering ou un cache Redis pour absorber le pic.',
              '',
              '> *Ticket incident ouvert automatiquement par le pipeline CI suite à l échec des tests de performance.*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'performance', 'ci-failure', 'automated-issue']
            });

      - name: 🧹 Teardown Docker Stack
        if: always()
        run: |
          docker compose down -v
