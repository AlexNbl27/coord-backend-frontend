name: API Load Testing (k6)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:
    inputs:
      max_vus:
        description: 'Capacité maximale ciblée (MAX_VUS) - Les paliers seront à 10%, 30%, 60%, 100%'
        required: false
        default: '500'
      max_ping_ms:
        description: 'Marge de ping tolérée en ms (p95) avant création de ticket (défaut: 500)'
        required: false
        default: '500'

permissions:
  contents: read
  issues: write

jobs:
  load-test:
    name: Run k6 Load & Stress Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "AUDIT_KEY=$(openssl rand -hex 32)"
            echo "MONGO_ROOT_USERNAME=root"
            echo "MONGO_ROOT_PASSWORD=$(openssl rand -hex 24)"
            echo "MONGO_MASTER_PASSWORD=$(openssl rand -hex 24)"
            echo "MONGO_TENANT_PASSWORD=$(openssl rand -hex 24)"
            echo "MONGO_PURGE_PASSWORD=$(openssl rand -hex 24)"
            echo "K6_ADMIN_EMAIL=k6-admin-${{ github.run_id }}@cineslot.test"
            echo "K6_ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"

      - name: Start MongoDB & Backend stack
        run: |
          docker compose up -d mongodb backend

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for Backend API (backend:3000/health, depuis le conteneur) to be ready..."
          max_retries=30
          count=0
          until docker compose exec -T backend node -e "fetch('http://127.0.0.1:3000/health').then(r=>r.text()).then(t=>process.stdout.write(t))" 2>/dev/null | grep -q '"database":"connected"'; do
            sleep 2
            count=$((count+1))
            if [ $count -ge $max_retries ]; then
              echo "Backend did not become healthy in time!"
              docker compose logs backend
              exit 1
            fi
          done
          echo "API is up and connected to MongoDB!"

      - name: Create k6 admin account
        run: |
          docker compose exec -T backend node scripts/create-admin.js \
            --email "$K6_ADMIN_EMAIL" --name "k6 Admin" --password "$K6_ADMIN_PASSWORD"

      - name: Execute k6 Load Test
        id: k6_test
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MAX_VUS="${{ inputs.max_vus }}"
            MAX_PING="${{ inputs.max_ping_ms }}"
          else
            # Charge de validation automatique sur Push/PR (adaptée au runner CI 2 vCPUs)
            MAX_VUS="50"
            MAX_PING="500"
          fi
          echo "RUN_MAX_VUS=$MAX_VUS" >> $GITHUB_ENV
          echo "RUN_MAX_PING=$MAX_PING" >> $GITHUB_ENV
          echo "Lancement du test k6 (Mode: ${{ github.event_name }}, MAX_VUS: ${MAX_VUS}, Tolérance ping: ${MAX_PING}ms)..."
          docker compose run --rm -e MAX_VUS="$MAX_VUS" -e MAX_PING_MS="$MAX_PING" k6-ci

      - name: Create GitHub Issue on Test Failure
        if: always() && steps.k6_test.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commitSha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const maxVus = process.env.RUN_MAX_VUS || '50';
            const maxPing = process.env.RUN_MAX_PING || '500';

            const title = `[Load Test] p95 latency exceeded ${maxPing}ms on ${branch} (${commitSha})`;
            const body = [
              `Load test failed on branch \`${branch}\` (commit \`${commitSha}\`).`,
              '',
              `- Target VUs: \`${maxVus}\``,
              `- Threshold: \`p(95) < ${maxPing}ms\`, error rate \`< 1%\``,
              `- Workflow run: ${runUrl}`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['performance', 'ci-failure']
            });

      - name: Teardown Docker Stack
        if: always()
        run: |
          docker compose down -v
