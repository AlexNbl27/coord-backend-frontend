limit_req_zone $binary_remote_addr zone=otlp_limit:10m rate=10r/s;

log_format sans_position '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 cineslot.localhost "~^[a-z0-9-]{3,30}\.cineslot\.localhost$";
    server_tokens off;
    access_log /var/log/nginx/access.log sans_position;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/slots/events {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /otlp/ {
        limit_req zone=otlp_limit burst=20 nodelay;
        client_max_body_size 256k;
        proxy_pass http://collector:4318/;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
