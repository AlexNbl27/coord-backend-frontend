limit_req_zone $binary_remote_addr zone=otlp_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sse_conn:10m;

log_format sans_position '$remote_addr [$time_local] "$host" "$request_method $uri" $status $body_bytes_sent';

map $http_host $apex_host {
    default "cineslot.localhost";
    "~^(?:localhost|127\.0\.0\.1)(:\d{1,5})?$" "cineslot.localhost$1";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    access_log off;

    location = /health {
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 $scheme://$apex_host$uri;
    }
}

server {
    listen 80;
    server_name cineslot.localhost "~^(?<tenant>[a-z0-9-]{3,30})\.cineslot\.localhost$";
    server_tokens off;
    access_log /var/log/nginx/access.log sans_position;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app-common.conf;

    location /api/admin {
        return 404;
    }

    location = /api/slots/events {
        limit_conn sse_conn 10;
        limit_conn_status 429;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name admin.cineslot.localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log sans_position;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/admin-allowlist.conf;
    include /etc/nginx/snippets/security-headers-admin.conf;
    include /etc/nginx/snippets/app-common.conf;

    location = /api/slots/events {
        return 404;
    }

    location /api {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers-admin.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
